window.fetch=function(u,o){
  var s=String(u);
  if(s.indexOf('/api/v1/mkt/tickers/')>-1){
    return Promise.all([of(u,o),CFG]).then(function(x){
      var r=x[0],h=(x[1].hidden||[]).map(function(v){return String(v).toUpperCase()});
      if(!h.length||!r.ok)return r;
      return r.clone().json().then(function(a){
        if(!Array.isArray(a))return r;
        a=a.filter(function(t){return h.indexOf(String(t.symbol).split('_')[0].toUpperCase())<0});
        return new Response(JSON.stringify(a),{status:200,headers:{'content-type':'application/json'}});
      }).catch(function(){return r});
    });
  }
  return of(u,o);
};
