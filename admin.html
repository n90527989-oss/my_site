<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>پنل مدیریت</title>
<style>
:root{--bg:#0a0e13;--cd:#121920;--ed:#1d2833;--tx:#e8eef4;--mu:#8696a6;--ac:#1bc48a;--dn:#ff5d6c;--wn:#f5b942;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#10372c55,transparent),var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 0}
button,input,textarea,select{font:inherit;color:inherit}input,textarea,select{width:100%;background:#0d1319;border:1px solid var(--ed);border-radius:12px;padding:11px 13px}input:focus,textarea:focus{outline:0;border-color:var(--ac)}
button{border:1px solid var(--ed);background:var(--cd);border-radius:12px;padding:9px 16px;cursor:pointer}button.p{background:var(--ac);color:#04140d;border-color:var(--ac);font-weight:800}button.d{color:var(--dn)}button:disabled{opacity:.5}

.fd{margin-bottom:12px}.fd label{display:block;margin-bottom:4px;color:var(--mu);font-size:.85rem}#tt{position:fixed;top:calc(12px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:var(--ac);color:#04140d;padding:9px 18px;border-radius:12px;font-weight:800;z-index:9;display:none}
</style></head><body>
<div id="lg"><div class="cd"><div class="lo">M</div><h2 style="margin:0 0 4px">پنل مدیریت</h2><p class="m">رمز ادمین را وارد کن</p><input id="pw" type="password" placeholder="رمز" autocomplete="current-password"><p id="le" class="m" style="color:var(--dn);min-height:1.4em"></p><button class="p" id="lb" style="width:100%">ورود</button></div></div>
<div id="ap"><div class="tp"><h1 id="ti"></h1><button id="rf">↻</button><button id="lo">خروج</button></div><div id="mn"></div>
<div class="nv" id="nv"></div></div><div id="tt"></div>
<script>
var $=function(i){return document.getElementById(i)},C={},T=[],U=[],V='dash',F='all',D=0,TN=['داشبورد','تیکت‌ها','کاربران','تنظیمات'],TK=['dash','tk','us','cf'],SL={new:'جدید',open:'باز',done:'بسته'};
function h(t,a,k){var e=document.createElement(t);for(var x in a||{}){if(x==='text')e.textContent=a[x];else if(x.slice(0,2)==='on')e[x]=a[x];else e.setAttribute(x,a[x])}(k||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function api(p,o){o=o||{};o.credentials='same-origin';if(o.body&&typeof o.body!=='string'){o.body=JSON.stringify(o.body);o.headers={'content-type':'application/json'}}return fetch('/api/admin/'+p,o).then(function(r){if(r.status===401){sh(false);throw 0}if(!r.ok)throw r;return r.json()})}
function toast(m){var t=$('tt');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
function dt(t){return new Date(t).toLocaleDateString('fa-IR')}function fa(n){return n.toLocaleString('fa-IR')}
function sh(on){$('lg').style.display=on?'none':'grid';$('ap').style.display=on?'block':'none'}
function login(){$('lb').disabled=true;fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pw').value})}).then(function(r){$('lb').disabled=false;if(r.ok){$('pw').value='';sh(true);load()}else $('le').textContent='رمز اشتباه است.'}).catch(function(){$('lb').disabled=false;$('le').textContent='خطا در اتصال'})}
$('lb').onclick=login;$('pw').onkeydown=function(e){if(e.key==='Enter')login()};
$('lo').onclick=function(){api('logout',{method:'POST'}).catch(function(){});sh(false)};$('rf').onclick=function(){load()};
function load(){return Promise.all([api('inbox'),api('users'),api('config')]).then(function(r){T=r[0]||[];U=r[1]||[];C=r[2]||{};render()}).catch(function(){})}
function wait(t){return t.status!=='done'&&t.last_author!=='admin'}
function nav(){var n=T.filter(wait).length,nv=$('nv');nv.textContent='';TK.forEach(function(k,i){var b=h('button',{text:TN[i],class:V===k?'on':'',onclick:function(){V=k;D=0;render()}});if(k==='tk'&&n)b.appendChild(h('span',{class:'bd',text:fa(n)}));nv.appendChild(b)})}
function render(){nav();$('ti').textContent=TN[TK.indexOf(V)];var m=$('mn');m.textContent='';({dash:dash,tk:tick,us:users,cf:conf})[V](m)}
function dash(m){var d0=new Date().setHours(0,0,0,0),day=864e5,s=[['کاربران',U.length],['تیکت باز',T.filter(function(t){return t.status!=='done'}).length],['منتظر پاسخ',T.filter(wait).length],['ثبت‌نام امروز',U.filter(function(u){return u.created>=d0}).length]];
var g=h('div',{class:'g'});s.forEach(function(x){g.appendChild(h('div',{class:'cd st'},[h('span',{class:'m',text:x[0]}),h('b',{text:fa(x[1])})]))});m.appendChild(g);
var cs=[],mx=1;for(var i=6;i>=0;i--){var a=d0-i*day,c=U.filter(function(u){return u.created>=a&&u.created<a+day}).length;cs.push([new Date(a).toLocaleDateString('fa-IR',{weekday:'short'}),c]);mx=Math.max(mx,c)}
var ch=h('div',{class:'ch'});cs.forEach(function(x){ch.appendChild(h('div',{},[h('span',{text:fa(x[1])}),h('i',{style:'height:'+Math.round(x[1]/mx*80)+'%'}),h('span',{text:x[0]})]))});
m.appendChild(h('div',{class:'cd'},[h('b',{text:'ثبت‌نام‌های ۷ روز اخیر'}),ch]));
var c=h('div',{class:'cd'},[h('b',{text:'آخرین تیکت‌ها'})]);T.slice(0,5).forEach(function(t){c.appendChild(trow(t))});if(!T.length)c.appendChild(h('p',{class:'m',text:'تیکتی نیست.'}));m.appendChild(c)}
function trow(t){return h('div',{class:'it',onclick:function(){V='tk';D=t.id;render()}},[h('div',{class:'av',text:((t.username||t.name||'؟')+'')[0].toUpperCase()}),h('div',{class:'fl'},[h('b',{text:t.subject||t.message||'—'}),h('span',{class:'m',text:(t.username||t.name||'مهمان')+' · '+dt(t.last_at||t.created)})]),h('span',{class:'tg '+t.status,text:wait(t)&&t.status!=='new'?'منتظر پاسخ':SL[t.status]||t.status})])}
function tick(m){if(D)return thread(m);var cp=h('div',{class:'cp'});[['all','همه'],['new','جدید'],['open','باز'],['done','بسته']].forEach(function(x){cp.appendChild(h('button',{text:x[1],class:F===x[0]?'on':'',onclick:function(){F=x[0];render()}}))});m.appendChild(cp);
var l=T.filter(function(t){return F==='all'||t.status===F}),c=h('div',{class:'cd'});l.forEach(function(t){c.appendChild(trow(t))});if(!l.length)c.appendChild(h('p',{class:'m',text:'موردی نیست.'}));m.appendChild(c)}
function thread(m){var id=D,box=h('div',{class:'cd'},[h('p',{class:'m',text:'در حال بارگذاری…'})]);m.appendChild(box);
api('inbox?ticket='+encodeURIComponent(id)).then(function(d){var t=d.ticket;box.textContent='';
box.appendChild(h('div',{class:'r',style:'margin-bottom:8px'},[h('button',{text:'← بازگشت',onclick:function(){D=0;render()}}),h('b',{text:t.subject||'تیکت',style:'flex:1'}),h('span',{class:'tg '+t.status,text:SL[t.status]||t.status})]));
box.appendChild(h('p',{class:'m',text:(t.username?'@'+t.username+(t.email?' · '+t.email:''):(t.name||'مهمان')+(t.contact?' · '+t.contact:''))+' · '+dt(t.created)}));
box.appendChild(h('div',{class:'bb u'},[t.message]));
d.msgs.forEach(function(g){box.appendChild(h('div',{class:'bb '+(g.author==='admin'?'a':'u')},[h('small',{text:(g.author==='admin'?'پشتیبانی':'کاربر')+' · '+dt(g.created)}),g.body]))});
var ta=h('textarea',{rows:'3',placeholder:'پاسخ…',maxlength:'2000'});box.appendChild(ta);
function send(close){var v=ta.value.trim();if(!v)return;api('inbox',{method:'POST',body:{ticket:id,body:v,close:!!close}}).then(function(){toast('ارسال شد');load()}).catch(function(){toast('خطا')})}
box.appendChild(h('div',{class:'r',style:'margin-top:10px;flex-wrap:wrap'},[h('button',{class:'p',text:'ارسال',onclick:function(){send(0)}}),h('button',{text:'ارسال و بستن',onclick:function(){send(1)}}),
h('button',{text:t.status==='done'?'بازکردن':'بستن',onclick:function(){api('inbox',{method:'PATCH',body:{ticket:id,status:t.status==='done'?'open':'done'}}).then(load)}}),
h('button',{class:'d',text:'حذف',onclick:function(){if(confirm('این تیکت حذف شود؟'))api('inbox?ticket='+encodeURIComponent(id),{method:'DELETE'}).then(function(){D=0;load()})}})]))}).catch(function(){})}
function users(m){var q=h('input',{placeholder:'جستجوی نام یا ایمیل…'}),c=h('div',{class:'cd'});m.appendChild(q);m.appendChild(h('div',{style:'height:12px'}));m.appendChild(c);
function fill(){c.textContent='';var s=q.value.toLowerCase(),l=U.filter(function(u){return (u.username+' '+u.email).toLowerCase().indexOf(s)>-1});
l.forEach(function(u){c.appendChild(h('div',{class:'it',style:'cursor:default'},[h('div',{class:'av',text:u.username[0].toUpperCase()}),h('div',{class:'fl'},[h('b',{text:u.username}),h('span',{class:'m',dir:'ltr',text:u.email||''}),h('span',{class:'m',text:dt(u.created)+' · '+fa(u.tickets||0)+' تیکت'})]),h('button',{class:'d',text:'حذف',onclick:function(){if(confirm('کاربر '+u.username+' حذف شود؟'))api('users?id='+u.id,{method:'DELETE'}).then(load)}})]))});
if(!l.length)c.appendChild(h('p',{class:'m',text:'کاربری پیدا نشد.'}))}
q.oninput=fill;fill()}
function conf(m){var b=C.banner||{},hr=C.hero||{},on=h('input',{type:'checkbox',style:'width:auto'}),bt=h('input',{value:b.text||'',maxlength:'200'}),bc=h('input',{type:'color',value:(b.color||'#0fae78').slice(0,7),style:'height:44px'}),ht=h('input',{value:hr.title||'',maxlength:'120'}),hs=h('textarea',{rows:'2',maxlength:'300'}),hd=h('textarea',{rows:'2',dir:'ltr',placeholder:'BTC, ETH, …'});
on.checked=!!b.on;hs.value=hr.sub||'';hd.value=(C.hidden||[]).join(', ');
function f(l,e){return h('div',{class:'fd'},[h('label',{text:l}),e])}
m.appendChild(h('div',{class:'cd'},[h('b',{text:'بنر بالای سایت'}),h('div',{class:'fd r',style:'margin-top:8px'},[on,h('span',{text:'نمایش بنر'})]),f('متن بنر',bt),f('رنگ',bc)]));
m.appendChild(h('div',{class:'cd'},[h('b',{text:'متن صفحه‌ی اصلی'}),f('عنوان',ht),f('زیرعنوان',hs)]));
m.appendChild(h('div',{class:'cd'},[h('b',{text:'ارزهای مخفی'}),f('نمادها با کاما جدا شوند',hd)]));
var sv=h('button',{class:'p',text:'ذخیره‌ی تنظیمات',style:'width:100%',onclick:function(){sv.disabled=true;var body={banner:{on:on.checked,text:bt.value,color:bc.value},hero:{title:ht.value,sub:hs.value},faq:C.faq||[],hidden:hd.value.split(/[\s,،]+/).filter(Boolean)};api('config',{method:'PUT',body:body}).then(function(){C=body;toast('ذخیره شد');sv.disabled=false}).catch(function(){toast('خطا در ذخیره');sv.disabled=false})}});m.appendChild(sv)}
api('me').then(function(){sh(true);load()}).catch(function(){sh(false)});
</script></body></html>
